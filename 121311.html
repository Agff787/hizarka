<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация в системе</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form id="registerForm" class="border rounded p-4 bg-white shadow-sm">
                <h4 class="mb-4 text-center">Регистрация</h4>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Иван" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Фамилия</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Иванов" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="regLogin" class="form-label">Логин</label>
                    <input type="text" class="form-control" id="regLogin" placeholder="Придумайте логин" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="regPassword" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="Придумайте пароль" required>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Повторите пароль" required>
                </div>

            
                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
              
                <div class="text-center text-muted mt-3">
                    Уже есть аккаунт? <a href="123123.html">Войти</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальное окно ошибки регистрации -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="errorModalLabel">Ошибка регистрации</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body" id="errorModalBody">
        Текст ошибки будет здесь.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

<script>
    const form = document.getElementById('registerForm');
    const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
    const errorModalBody = document.getElementById('errorModalBody');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const login = document.getElementById('regLogin').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        
        if (password !== confirmPassword) {
            errorModalBody.textContent = 'Пароли не совпадают. Пожалуйста, проверьте ввод.';
            errorModal.show();
            return;
        }

        if (password.length < 6) {
            errorModalBody.textContent = 'Пароль должен быть не менее 6 символов.';
            errorModal.show();
            return;
        }
        window.location.href = 'login.html'; 
    });
</script>

</body>
</html>
